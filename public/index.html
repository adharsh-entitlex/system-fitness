<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#05070f" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Solo Leveling inspired personal fitness, hydration and nutrition tracker." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>THE SYSTEM — Fitness &amp; Health</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="orb orb-a" aria-hidden="true"></div>
<div class="orb orb-b" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<div class="app">
  <header class="topbar">
    <div class="sigil" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M24 3 44 14v20L24 45 4 34V14L24 3Z" stroke="url(#g1)" stroke-width="1.5" />
        <path d="M24 11 36 18v12L24 37 12 30V18l12-7Z" stroke="#5fe6ff" stroke-opacity=".55" stroke-width="1" />
        <path d="M24 17v14M18 24h12" stroke="#5fe6ff" stroke-width="1.6" stroke-linecap="round" />
        <defs>
          <linearGradient id="g1" x1="4" y1="3" x2="44" y2="45" gradientUnits="userSpaceOnUse">
            <stop stop-color="#5fe6ff" /><stop offset="1" stop-color="#8b5cf6" />
          </linearGradient>
        </defs>
      </svg>
    </div>

    <div class="hunter">
      <span class="eyebrow">HUNTER</span>
      <span class="hunter-name" id="hunterName">HUNTER</span>
    </div>

    <div class="level-block">
      <div class="lvl-row">
        <span class="rank" id="rankBadge">E</span>
        <span class="lvl">LEVEL <b id="levelNum">1</b></span>
        <span class="xp-text" id="xpText">0 / 500 XP</span>
      </div>
      <div class="xpbar"><span id="xpFill"></span></div>
    </div>

    <button class="icon-btn" id="settingsBtn" data-act="open-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="1.4"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.7-1.3-1.8-3.1-2 .8a7.5 7.5 0 0 0-2.6-1.5L14.4 3H9.6l-.3 2.4a7.5 7.5 0 0 0-2.6 1.5l-2-.8-1.8 3.1L4.6 10.5a7.6 7.6 0 0 0 0 3L2.9 14.8l1.8 3.1 2-.8a7.5 7.5 0 0 0 2.6 1.5l.3 2.4h4.8l.3-2.4a7.5 7.5 0 0 0 2.6-1.5l2 .8 1.8-3.1-1.7-1.3Z" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab is-active" data-act="tab" data-view="today" role="tab">TODAY</button>
    <button class="tab" data-act="tab" data-view="workouts" role="tab">WORKOUTS</button>
    <button class="tab" data-act="tab" data-view="nutrition" role="tab">NUTRITION</button>
    <button class="tab" data-act="tab" data-view="history" role="tab">HISTORY</button>
    <button class="tab" data-act="tab" data-view="progress" role="tab">PROGRESS</button>
  </nav>

  <main>
    <section class="view is-active" id="view-today" aria-label="Today"></section>
    <section class="view" id="view-workouts" aria-label="Workouts"></section>
    <section class="view" id="view-nutrition" aria-label="Nutrition"></section>
    <section class="view" id="view-history" aria-label="Workout history"></section>
    <section class="view" id="view-progress" aria-label="Progress"></section>
  </main>

  <footer class="foot">
    THE SYSTEM · PERSONAL TRAINING INTERFACE
    <span class="foot-sync is-offline" id="syncState">SERVER · LOCAL ONLY</span>
  </footer>
</div>

<div class="gate" id="authGate" hidden>
  <div class="gate-card" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <svg class="gate-sigil" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M24 3 44 14v20L24 45 4 34V14L24 3Z" stroke="url(#gg)" stroke-width="1.5" />
      <path d="M24 17v14M18 24h12" stroke="#5fe6ff" stroke-width="1.6" stroke-linecap="round" />
      <defs>
        <linearGradient id="gg" x1="4" y1="3" x2="44" y2="45" gradientUnits="userSpaceOnUse">
          <stop stop-color="#5fe6ff" /><stop offset="1" stop-color="#8b5cf6" />
        </linearGradient>
      </defs>
    </svg>
    <h1 id="gateTitle">SYSTEM LOCKED</h1>
    <p id="gateText">Sign in with your Freebuff account to open your record.</p>
    <a class="btn primary" id="gateSignIn" href="/auth/freebuff/signin?returnTo=/">SIGN IN WITH FREEBUFF</a>
    <form method="post" action="/auth/freebuff/signout">
      <button class="btn ghost" type="submit">SIGN OUT</button>
    </form>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modalRoot" hidden></div>

<script src="foods.js"></script>
<script src="app.js"></script>
<script src="nutrition.js"></script>
<script src="sync.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* offline shell is a bonus */ });
    });
  }
</script>
</body>
</html>
