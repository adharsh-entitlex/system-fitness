name: Secret guard

# Fails a push or pull request that adds a credentials file or a real key.
# The same check runs locally as a pre-commit hook (.githooks/pre-commit).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check tracked files for credentials
        run: node scripts/check-secrets.mjs
